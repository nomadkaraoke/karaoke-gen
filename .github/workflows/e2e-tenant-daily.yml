name: E2E Daily Test (Tenant Portals)

# Full production E2E per white-label tenant: submit a job with the tenant's own
# mixed + instrumental audio, approve the lyrics review, wait for the render, and assert
# the tenant distribution (locked theme, no YouTube, no Google Drive, Dropbox folder +
# downloadable outputs). Mirrors the consumer e2e-daily.yml. Each run cleans up its job.

on:
  schedule:
    # Daily at 00:07 UTC = ~8pm US Eastern (8:07pm EDT / 7:07pm EST). Cron is fixed
    # UTC so the local time shifts 1h across DST. Off the :00 mark to avoid the
    # top-of-hour scheduler herd.
    - cron: '7 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # for Workload Identity Federation

jobs:
  e2e-tenant:
    name: "Tenant E2E: ${{ matrix.tenant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Run tenants sequentially: the GCE encoder is a single shared worker, and two
      # concurrent full renders overwhelm it ("lost contact with worker"). One at a time.
      max-parallel: 1
      matrix:
        tenant: [vocalstar, singa]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Fetch test audio (private GCS)
        run: bash scripts/e2e/fetch_test_audio.sh frontend/e2e/fixtures

      - name: Ensure testmail.app domain is allowlisted (rate limit)
        run: |
          curl -sf -X POST \
            "https://api.nomadkaraoke.com/api/admin/rate-limits/blocklists/allowlisted-domains" \
            -H "X-Admin-Token: ${{ secrets.E2E_ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"domain": "inbox.testmail.app"}' || echo "Warning: allowlist may already exist"

      - name: Run tenant E2E (frontend journey)
        id: run_test
        working-directory: frontend
        env:
          TESTMAIL_API_KEY: ${{ secrets.TESTMAIL_API_KEY }}
          TESTMAIL_NAMESPACE: ${{ secrets.TESTMAIL_NAMESPACE }}
          E2E_ADMIN_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}
          TENANT_ID: ${{ matrix.tenant }}
          TENANT_PORTAL_URL: https://${{ matrix.tenant }}.nomadkaraoke.com
        run: |
          echo "=== Tenant E2E (frontend): ${{ matrix.tenant }} ==="
          npx playwright test tenant-happy-path.spec.ts \
            --config=playwright.production.config.ts --project=chromium \
            --reporter=list --timeout=2400000 2>&1 | tee e2e-output.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tenant-${{ matrix.tenant }}-${{ github.run_number }}
          path: |
            frontend/e2e-output.log
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14

      - name: Discord notification (failure)
        if: ${{ steps.run_test.outputs.exit_code != '0' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -s -H "Content-Type: application/json" \
              -d "{\"embeds\": [{\"title\": \"❌ Tenant E2E FAILED — ${{ matrix.tenant }}\", \"description\": \"Run: #${{ github.run_number }}\", \"color\": 15158332}]}" \
              "$DISCORD_WEBHOOK" || true
          fi

      - name: Fail the job if the test failed
        if: ${{ steps.run_test.outputs.exit_code != '0' }}
        run: exit 1

  notify-email:
    name: "Email summary"
    runs-on: ubuntu-latest
    needs: e2e-tenant
    if: ${{ always() && github.event_name == 'schedule' }}
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.postmarkapp.com
          server_port: 587
          username: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          password: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          subject: "Tenant E2E Daily ${{ needs.e2e-tenant.result == 'success' && 'PASSED' || 'FAILED' }} - Run #${{ github.run_number }}"
          to: andrew@nomadkaraoke.com
          from: "Karaoke Gen CI <noreply@nomadkaraoke.com>"
          body: |
            Tenant E2E Daily Test (Vocal Star + Singa)
            Result: ${{ needs.e2e-tenant.result }}
            Run: #${{ github.run_number }}
            Details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
